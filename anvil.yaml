allow_embedding: false
db_schema:
  journal_post:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: username
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: post
      type: string
    - admin_ui: {order: 2, width: 200}
      client_hidden: false
      name: created
      type: datetime
    indexes: []
    server: full
    title: journal_post
metadata: {description: A simple hobby site made for students to just talk openly, title: LiveJournal}
name: LiveJournal
package_name: LiveJournal
runtime_options:
  client_version: '3'
  legacy_features: {bootstrap3: true, class_names: true}
  server_spec: {base: python310-minimal}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
startup: {module: HomeScreen, type: form}
startup_form: null
