allow_embedding: false
db_schema:
  journal_post:
    client: full
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: username
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: post
      type: string
    - admin_ui: {order: 2, width: 200}
      client_hidden: false
      name: created
      type: datetime
    indexes: []
    server: full
    title: journal_post
metadata: {description: 'A place for people to anonymously share/read their/elses day, thoughts or idea', logo_img: 'asset:images.png', title: LiveJournal}
name: LiveJournal
package_name: LiveJournal
runtime_options:
  client_version: '3'
  legacy_features: {bootstrap3: true, class_names: true}
  server_spec: {base: python310-minimal}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
startup: {module: HomeScreen, type: form}
startup_form: null
